        id: &id001
          $ref: '#/components/schemas/Id'
        label:
          type: string
        endpoint_origin:
          type: string
          format: uri
        api_format:
          type: string
          enum:
          - openai_compatible
          - anthropic_compatible
        credential_present: &id003
          type: boolean
        credential_retention:
          type: string
          enum:
          - single_experiment
          - saved
        status:
          type: string
          enum:
          - unverified
          - ready
          - failed
          - revoked
          - expired
        created_at:
          type: string
          format: date-time
      required:
      - id
      - label
      - endpoint_origin
      - api_format
      - credential_present
      - credential_retention
      - status
      - created_at
    ConnectionProbeRequest:
      type: object
      additionalProperties: false
      properties:
        model_id:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - model_id
    ConnectionProbeResult:
      type: object
      additionalProperties: false
      properties:
        connection_id: *id001
        status:
          type: string
          enum:
          - compatible
          - incompatible
          - unreachable
        model_identity_verified:
          const: false
        diagnostic_code:
          type: string
        estimated_cost_minor:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - connection_id
      - status
      - model_identity_verified
      - diagnostic_code
      - estimated_cost_minor
      description: Connectivity and protocol smoke test only; may incur model-provider usage. It does not authenticate
        model identity.
    ExperimentCreate:
      type: object
      additionalProperties: false
      properties:
        connection_id: *id001
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        benchmark_id: *id001
        methodology_id: *id001
        label:
          type: string
          maxLength: 160
        parent_experiment_id:
          anyOf:
          - *id001
          - &id002
            type: 'null'
      required:
      - connection_id
      - model_id
      - benchmark_id
      - methodology_id
      - label
      description: Methodology determines fixed prompt, repetitions and budgets. No prompt override, hidden case
        IDs, or owner override accepted. Snapshot endpoint/model/methodology at creation.
    Experiment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        label:
          type: string
        model_id_declared:
          type: string
        connection_id: *id001
        benchmark_id: *id001
        methodology_id: *id001
        methodology_sha256: &id004
          $ref: '#/components/schemas/Hash'
        state:
          type: string
          enum:
          - queued
          - generating
          - freezing
          - evaluating
          - aggregating
          - completed
          - generation_failed
          - infra_failed
          - canceled
          - disqualified
        planned_generations:
          type: integer
          minimum: 1
        finished_generations:
          type: integer
          minimum: 0
        planned_runs:
          type: integer
          minimum: 0
        finished_runs:
          type: integer
          minimum: 0
        result_id:
          anyOf:
          - *id001
          - *id002
        created_at:
          type: string
          format: date-time
      required:
      - id
      - label
      - model_id_declared
      - connection_id
      - benchmark_id
      - methodology_id
      - methodology_sha256
      - state
      - planned_generations
      - finished_generations
      - planned_runs
      - finished_runs
      - result_id
      - created_at
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
        role:
          type: string
          enum:
          - submitter
          - organizer
        auth_provider:
          type: string
          enum:
          - bootstrap
          - github
      required:
      - id
      - display_name
      - role
      - auth_provider
    CollectionCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 4000
      required:
      - title
      - description
    CollectionItemCreate:
      type: object
      additionalProperties: false
      properties:
        result_id: *id001
      required:
      - result_id
    Collection:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title:
          type: string
        description:
          type: string
        result_ids:
          type: array
          items: *id001
          maxItems: 200
        created_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - description
      - result_ids
      - created_at
      description: References authorized immutable result records; does not grant access to hidden artifacts.
    ShareCreate:
      type: object
      additionalProperties: false
      properties:
        resource_type:
          type: string
          enum:
          - result
          - collection
        resource_id: *id001
        include_source: *id003
      required:
      - resource_type
      - resource_id
      - include_source
      description: No log, secret or active hidden replay scopes. include_source requires independent source-visibility
        authorization.
    ShareCreated:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        resource_type:
          type: string
          enum:
          - result
          - collection
        resource_id: *id001
        share_path:
          type: string
          pattern: ^/s/[A-Za-z0-9_-]+$
          description: High-entropy secret URL path; returned on creation only. Do not log or expose through generic
            listings.
        created_at:
          type: string
          format: date-time
      required:
      - id
      - resource_type
      - resource_id
      - share_path
      - created_at
    MethodologyBudgets:
      type: object
      additionalProperties: false
      properties:
        generation_wall_ms:
          type: integer
          minimum: 1
        max_model_calls:
          type: integer
          minimum: 1
        max_output_tokens_per_call:
          type: integer
          minimum: 1
        generation_repetitions:
          type: integer
          minimum: 1
        candidate_runtime_image_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        generation_image_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      required:
      - generation_wall_ms
      - max_model_calls
      - max_output_tokens_per_call
      - generation_repetitions
      - candidate_runtime_image_digest
      - generation_image_digest
    MethodologyPublic:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          const: published
        methodology_sha256: *id004
        system_prompt:
          type: string
        task_prompt:
          type: string
        tool_schema_text:
          type: string
          description: Canonical JSON text of complete effective tool definitions, not just their names.
        tool_schema_sha256: *id004
        public_bundle_sha256: *id004
        harness_name:
          type: string
        harness_commit:
          type: string
        adapter_version:
          type: string
        context_policy:
          type: string
        retry_policy:
          type: string
        budgets:
          $ref: '#/components/schemas/MethodologyBudgets'
      required:
      - id
      - status
      - methodology_sha256
      - system_prompt
      - task_prompt
      - tool_schema_text
      - tool_schema_sha256
      - public_bundle_sha256
      - harness_name
      - harness_commit
      - adapter_version
      - context_policy
      - retry_policy
      - budgets
      description: Effective platform-controlled input manifest. No provider credentials or private traces. Different
        transport formats are disclosed, not falsely claimed byte-identical.
    TierScorePublic:
      type: object
      additionalProperties: false
      properties:
        difficulty:
          type: string
          enum:
          - easy
          - medium
          - complex
        mean_revenue_minor:
          type: number
          minimum: 0
        independent_generations:
          type: integer
          minimum: 1
        completed_runs:
          type: integer
          minimum: 0
        candidate_failed_runs:
          type: integer
          minimum: 0
        unit:
          const: game_currency_minor
      required:
      - difficulty
      - mean_revenue_minor
      - independent_generations
      - completed_runs
      - candidate_failed_runs
      - unit
    PublicResult:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        label:
          type: string
        benchmark_id: *id001
        methodology_id: *id001
        model_id_declared:
          type: string
        model_source:
          type: string
          enum:
          - platform_controlled
          - user_endpoint
          - imported
        execution_verification:
          type: string
          enum:
          - platform_verified
          - imported_unverified
        official_eligible: *id003
        scores:
          type: array
          items:
            $ref: '#/components/schemas/TierScorePublic'
          minItems: 1
          maxItems: 3
        source_sha256s:
          type: array
          items: *id004
        demo_replay_ids:
          type: array
          items: *id001
        usage_cost_status:
          type: string
          enum:
          - reported
          - estimated
          - unknown
      required:
      - id
      - label
      - benchmark_id
      - methodology_id
      - model_id_declared
      - model_source
      - execution_verification
      - official_eligible
      - scores
      - source_sha256s
      - demo_replay_ids
      - usage_cost_status
      description: Public white-list projection only. No keys, endpoint paths, raw messages, hidden case IDs or
        hidden events. Incomplete infra-failed matrices cannot produce a standard published result.
    PublicShare:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/PublicResult'
          maxItems: 200
      required:
      - title
      - results
      description: Only an authorized revocable share can resolve private results. Cache policy must respect revocation.
    GameCatalogEntry:
      type: object
      additionalProperties: false
