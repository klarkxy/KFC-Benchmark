openapi: 3.1.1
info:
  title: KitchenSched Platform API
  version: 0.3.0-draft
  description: Design contract, not deployed. v0.3 adds BYOK connections, experiment orchestration, personal collections,
    public methodology and revocable sharing. Controller JSONL remains 0.2.0. x-stage is planning metadata, not
    authorization. Release blockers are in harness/profile.draft.json.
servers:
- url: /api/v1
security:
- BearerAuth: []
tags:
- name: System
- name: Artifacts
- name: Submissions
- name: Benchmarks
- name: Runs
- name: Evaluations
- name: Leaderboards
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
      - System
      summary: getHealth
      description: ''
      x-roles:
      - viewer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
  /artifacts:
    post:
      operationId: uploadArtifact
      tags:
      - Artifacts
      summary: uploadArtifact
      description: Upload ZIP bytes; quarantine before extraction. Maximum compressed 10 MiB, expanded 50 MiB and
        1,000 files as provisional deployment limits. Reject traversal and symlinks. Not a remote URL fetcher.
      x-roles:
      - submitter
      - organizer
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
  /artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      tags:
      - Artifacts
      summary: getArtifact
      description: ''
      x-roles:
      - owner
      - organizer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: artifact_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /submissions:
    post:
      operationId: createSubmission
      tags:
      - Submissions
      summary: createSubmission
      description: Only a ready artifact owned by the principal can be referenced. model_config_id is pre-registered
        through an audited organizer configuration flow. Returns validating submission.
      x-roles:
      - submitter
      - organizer
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
  /submissions/{submission_id}:
    get:
      operationId: getSubmission
      tags:
      - Submissions
      summary: getSubmission
      description: ''
      x-roles:
      - owner
      - organizer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /submissions/{submission_id}/freeze:
    post:
      operationId: freezeSubmission
      tags:
      - Submissions
      summary: freezeSubmission
      description: Only ready can become frozen. Repeating freeze is harmless. New bytes require a new submission.
      x-roles:
      - owner
      - organizer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
  /benchmarks:
    get:
      operationId: listBenchmarks
      tags:
      - Benchmarks
      summary: listBenchmarks
      description: ''
      x-roles:
      - viewer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkPage'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
  /benchmarks/{benchmark_id}/scenarios/{scenario_id}:
    get:
      operationId: getPublicScenario
      tags:
      - Benchmarks
      summary: getPublicScenario
      description: Only published public practice scenarios. Hidden configurations are never enumerated here.
      x-roles:
      - viewer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicScenario'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      parameters:
      - name: benchmark_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: scenario_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /practice-runs:
    post:
      operationId: createPracticeRun
      tags:
      - Runs
      summary: createPracticeRun
      description: Ready or frozen source is snapshotted. Public scenario/case only; excluded from the official
        leaderboard.
      x-roles:
      - submitter
      - organizer
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeCreate'
  /evaluations:
    post:
      operationId: createEvaluation
      tags:
      - Evaluations
      summary: createEvaluation
      description: Require frozen submissions. Transactionally snapshot the complete case matrix, engine, limits
        and artifact hashes.
      x-roles:
      - organizer
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationCreate'
  /evaluations/{evaluation_id}:
    get:
      operationId: getEvaluation
      tags:
      - Evaluations
      summary: getEvaluation
      description: ''
      x-roles:
      - organizer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
  /runs/{run_id}:
    get:
      operationId: getRun
      tags:
      - Runs
      summary: getRun
      description: Official hidden runs are organizer-only until release. Apply projection and ownership; anonymous
        access only when explicitly released.
      x-roles:
      - owner-of-practice
      - organizer
      - viewer-of-released-run
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      security:
      - BearerAuth: []
      - {}
  /runs/{run_id}/events:
    get:
      operationId: getRunEvents
      tags:
      - Runs
      summary: getRunEvents
      description: Exclusive event cursor. Authorized immutable replay only; never stream hidden data to candidates.
        When no items are returned, next_after_seq equals the request cursor.
      x-roles:
      - owner-of-practice
      - organizer
      - viewer-of-released-run
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: after_seq
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
      security:
      - BearerAuth: []
      - {}
  /runs/{run_id}/checkpoints:
    get:
      operationId: getRunCheckpoint
      tags:
      - Runs
      summary: getRunCheckpoint
      description: Nearest authorized checkpoint at or before requested simulation time. Initial checkpoint is seq
        0, time 0. Continue events with after_seq=checkpoint_seq.
      x-roles:
      - owner-of-practice
      - organizer
      - viewer-of-released-run
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkpoint'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: at_or_before_ms
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      security:
      - BearerAuth: []
      - {}
  /runs/{run_id}/replay-manifest:
    get:
      operationId: getReplayManifest
      tags:
      - Runs
      summary: getReplayManifest
      description: Releasing leaderboard scores does not release replays. Full trajectories require separate approval
        or a retired/demo dataset.
      x-roles:
      - owner-of-practice
      - organizer
      - viewer-of-released-run
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayManifest'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      security:
      - BearerAuth: []
      - {}
  /runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      tags:
      - Runs
      summary: cancelRun
      description: Official cancellation remains an unresolved matrix cell and must be audited and rerun, not scored
        zero or omitted.
      x-roles:
      - owner-of-practice
      - organizer
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
  /leaderboards/{benchmark_id}:
    get:
      operationId: getLeaderboard
      tags:
      - Leaderboards
      summary: getLeaderboard
      description: Frozen snapshot, one difficulty. Candidate failures remain zeros. Equal scores share rank. Cursor
        binds the immutable snapshot to avoid moving pages.
      x-roles:
      - viewer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
      parameters:
      - name: benchmark_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: difficulty
        in: query
        required: true
        schema:
          type: string
          enum:
          - easy
          - medium
          - complex
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
  /leaderboards/{benchmark_id}/publish:
    post:
      operationId: publishLeaderboard
      tags:
      - Leaderboards
      summary: publishLeaderboard
      description: Reject unresolved infrastructure cells, incomplete planned generation matrix or hash mismatch
        with 409. Do not automatically publish source code or replay files.
      x-roles:
      - organizer
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        default:
          description: Problem Details. Unauthorized hidden resources return 404. Rate limits include Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: benchmark_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Scoped by principal, method and path. Same body returns the original object; changed body returns
          409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishCreate'
  /me:
    get:
      operationId: getCurrentUser
      summary: Read current authenticated identity
      x-stage: mvp
      x-roles:
      - organizer
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
  /model-connections:
    post:
      operationId: createModelConnection
      summary: Create private model connection with write-only key
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Required when authenticating by session cookie; omitted for bearer-only clients.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreate'
      description: MVP organizer only. Later authenticated submitters may access only their own objects under the
        same ownership, egress and budget checks.
    get:
      operationId: listModelConnections
      summary: List owned model connections
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
      description: MVP organizer only. Later authenticated submitters may access only their own objects under the
        same ownership, egress and budget checks.
  /model-connections/{connection_id}:
    get:
      operationId: getModelConnection
      summary: Read owned model connection without credential
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
    delete:
      operationId: revokeModelConnection
      summary: Revoke credential and prevent further requests
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Required when authenticating by session cookie; omitted for bearer-only clients.
      responses:
        '204':
          description: Success
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
  /model-connections/{connection_id}/probe:
    post:
      operationId: probeModelConnection
      summary: Explicit bounded connectivity/protocol test
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Required when authenticating by session cookie; omitted for bearer-only clients.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionProbeResult'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionProbeRequest'
  /experiments:
    post:
      operationId: createExperiment
      summary: Queue fixed-method model generation and evaluation
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Required when authenticating by session cookie; omitted for bearer-only clients.
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreate'
      description: MVP organizer only. Later authenticated submitters may access only their own objects under the
        same ownership, egress and budget checks.
    get:
      operationId: listExperiments
      summary: List owned experiments
      x-stage: mvp
      x-roles:
      - organizer
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentPage'
        default:
          description: Stable problem response. Unauthorized private resources return 404.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - BearerAuth: []
      - SessionCookie: []
      description: MVP organizer only. Later authenticated submitters may access only their own objects under the
        same ownership, egress and budget checks.
  /experiments/{experiment_id}:
    get:
      operationId: getExperiment
      summary: Read experiment progress
      x-stage: mvp
