name: pages

# Deploys the static site. results/ is overlaid onto the site's own
# public/results/ so a scored leaderboard is live without a rebuild commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "results/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_run:
    workflows: ["score"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Always build from the CURRENT main HEAD. workflow_run.head_sha points at
      # the commit the score workflow ran on, which predates its own results
      # commit — checking that out deploys a leaderboard one commit stale.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Save the site's own index BEFORE the overlay clobbers it, otherwise
      # site-only versions (demo-v1) can never be carried over.
      - name: Overlay results into the site
        run: |
          mkdir -p site/public/results
          cp site/public/results/index.json /tmp/site-index.json
          cp -r results/. site/public/results/

      # Generated (repo results/) entries win; site-only entries are carried over.
      - name: Merge site-only index entries
        run: |
          node --input-type=commonjs -e '
            const fs = require("fs");
            const sitePath = "site/public/results/index.json";
            const site = fs.existsSync("/tmp/site-index.json") ? JSON.parse(fs.readFileSync("/tmp/site-index.json", "utf8")) : { versions: [] };
            const generated = JSON.parse(fs.readFileSync("results/index.json", "utf8"));
            const known = new Set(generated.versions.map((entry) => entry.benchmark_version));
            for (const entry of site.versions) {
              if (!known.has(entry.benchmark_version)) generated.versions.push(entry);
            }
            fs.writeFileSync(sitePath, JSON.stringify(generated, null, 2) + "\n");
          '

      # Browser-playable bundles under site/public/scenarios/. Every workspace
      # package resolves through its exports map to src/, so tsx needs no dist;
      # regenerating here keeps the deployed game in step with the scenarios.
      - name: Generate scenario bundles
        run: pnpm exec tsx site/scripts/gen-scenarios.mts

      - run: pnpm --filter @kitchensched/site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4